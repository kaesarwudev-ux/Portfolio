<svg style="position:absolute;width:0;height:0;pointer-events:none" aria-hidden="true">
    <defs>
        <!-- 
             G channel = Y displacement (top/bottom edges)
             B channel = X displacement (left/right edges)
             Map image loaded as blob URL by init.js
        -->
        <filter id="filter-convex" color-interpolation-filters="sRGB">
            <feImage id="map-convex" href="" xlink:href="" result="disp" preserveAspectRatio="none" x="0" y="0" width="100%" height="100%"/>
            <feDisplacementMap in="SourceGraphic" in2="disp" scale="30" xChannelSelector="B" yChannelSelector="G"/>
        </filter>

        <filter id="filter-lip" color-interpolation-filters="sRGB">
            <feImage id="map-lip" href="" xlink:href="" result="disp" preserveAspectRatio="none" x="0" y="0" width="100%" height="100%"/>
            <feDisplacementMap in="SourceGraphic" in2="disp" scale="20" xChannelSelector="B" yChannelSelector="G"/>
        </filter>
    </defs>
</svg>
