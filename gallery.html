<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery — Kaesar Wu</title>
    <meta name="description" content="Kaesar Wu's visual portfolio — art, F1 collections, and photography.">
    <script src="theme-init.js"></script>
    <script src="theme.js" defer></script>
    <script src="engine.js" defer></script>
    <script src="specular.js" defer></script>
    <script src="lightbox.js" defer></script>
    <script src="init.js" defer></script>
    <script src="terminal.js" defer></script>
    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="terminal.css">
</head>
<body>

    <div id="svg-filters-container"></div>

    <header class="nav-wrapper">
        <nav class="liquid-glass nav-glass">
            <a href="index.html" class="logo">Kaesar Wu</a>
            <button class="mobile-nav-toggle" aria-label="Open menu" id="mobile-nav-toggle">
                <span class="hamburger-bar"></span>
                <span class="hamburger-bar"></span>
                <span class="hamburger-bar"></span>
            </button>
            <div class="links" id="nav-links">
                <a href="index.html">Home</a>
                <a href="journalism.html">Journalism</a>
                <a href="gallery.html" class="active">Gallery</a>
                <a href="about.html">About</a>
                <div id="theme-switch" class="apple-switch" title="Toggle theme">
                    <div class="apple-switch-knob"></div>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <h1>My Gallery</h1>
        <p>Mostly Max Verstappen Related stuff.</p>

        <div class="gallery-grid">
            <div class="liquid-glass interactive-glass gallery-item">
                <img src="assets/img/maximusverstoppeniaplantdrawing.png" alt="Maximus Verstoppenia Plant Drawing">
                <div class="gallery-meta mono">Maximus Verstoppenia Drawing</div>
            </div>
            <div class="liquid-glass interactive-glass gallery-item">
                <img src="assets/img/maxverstappenbookmarkfront.png" alt="Max Verstappen Bookmark — Front">
                <div class="gallery-meta mono">Bookmark Front</div>
            </div>
            <div class="liquid-glass interactive-glass gallery-item">
                <img src="assets/img/maxverstappenbookmarkback.png" alt="Max Verstappen Bookmark — Back">
                <div class="gallery-meta mono">Bookmark Back</div>
            </div>
            <div class="liquid-glass interactive-glass gallery-item">
                <img src="assets/img/sidverstappenplush.png" alt="Sid Verstappen Plush">
                <div class="gallery-meta mono">Sid Verstappen Plush</div>
            </div>
            <div class="liquid-glass interactive-glass gallery-item">
                <img src="assets/img/sidverstappenplushiewatchingmaxverstappen.png" alt="Sid Plush watching Max Verstappen race">
                <div class="gallery-meta mono">Sid Watching Max Race</div>
            </div>
            <div class="liquid-glass interactive-glass gallery-item">
                <img src="assets/img/MaxineVerstappen.jpg" alt="Maxine Verstappen">
                <div class="gallery-meta mono">My cutie patootie</div>
            </div>
        </div>
    </main>

    <div id="terminal-overlay">
        <div class="terminal-resize-handle" id="terminal-resize-handle"></div>
        <div class="terminal-header">
            <div class="terminal-header-label">
                <span class="dot"></span>
                KWDEV TERMINAL
            </div>
            <div class="terminal-header-actions">
                <button class="terminal-header-btn" id="terminal-close-btn" title="Close terminal">✕</button>
            </div>
        </div>
        <div class="terminal-body">
            <div class="terminal-output"></div>
            <div class="terminal-input-line">
                <span class="terminal-prompt">kwdev@verstappen:~$</span>
                <input type="text" spellcheck="false" autocomplete="off" />
            </div>
        </div>
    </div>
</body>
</html>
