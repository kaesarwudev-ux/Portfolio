<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Gallery — Kaesar Wu</title>
    <meta name="description" content="Kaesar Wu's visual portfolio — art, F1 collections, and photography.">
    <script src="theme-init.js"></script>
    <script src="theme.js" defer></script>
    <script src="engine.js" defer></script>
    <script src="specular.js" defer></script>

    <script src="init.js" defer></script>

    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="terminal.css">

    <svg style="position:absolute;width:0;height:0;pointer-events:none" aria-hidden="true">
        <defs>
            <filter id="filter-convex" color-interpolation-filters="sRGB">
                <feImage id="map-convex" href="" result="disp" preserveAspectRatio="none" x="0" y="0" width="100%" height="100%"/>
                <feDisplacementMap id="disp-convex" in="SourceGraphic" in2="disp" scale="8" xChannelSelector="B" yChannelSelector="G"/>
            </filter>
            <filter id="filter-lip" color-interpolation-filters="sRGB">
                <feImage id="map-lip" href="" result="disp" preserveAspectRatio="none" x="0" y="0" width="100%" height="100%"/>
                <feDisplacementMap id="disp-lip" in="SourceGraphic" in2="disp" scale="6" xChannelSelector="B" yChannelSelector="G"/>
            </filter>
        </defs>
    </svg>

    <script>
    (function() {
        var mapW = 64, mapH = 64, edgePx = 32;
        var c = document.createElement('canvas');
        c.width = mapW; c.height = mapH;
        var ctx = c.getContext('2d');
        var d = ctx.createImageData(mapW, mapH);
        for (var py = 0; py < mapH; py++) {
            for (var px = 0; px < mapW; px++) {
                var distT = py, distB = mapH - 1 - py;
                var distV = Math.min(distT, distB);
                var g = 128, b = 128;
                if (distV < edgePx) {
                    var t = distV / edgePx;
                    var wave = Math.cos(t * Math.PI);
                    var env = 1 - t * t * t * t;
                    var magY = env * wave;
                    var magX = env * wave * 1.5;
                    g = Math.round(128 - (distT <= distB ? -1 : 1) * magY * 127);
                    b = Math.round(128 + (distT <= distB ? -1 : 1) * magX * 127);
                }
                var i = (py * mapW + px) * 4;
                d.data[i] = 128; d.data[i+1] = Math.max(0,Math.min(255,g));
                d.data[i+2] = Math.max(0,Math.min(255,b)); d.data[i+3] = 255;
            }
        }
        ctx.putImageData(d, 0, 0);
        var url = c.toDataURL('image/png');
        var img = document.getElementById('map-convex');
        if (img) img.setAttribute('href', url);
        var img2 = document.getElementById('map-lip');
        if (img2) img2.setAttribute('href', url);
    })();
    </script>
</head>

            <div class="liquid-glass interactive-glass gallery-item">

            <div class="liquid-glass interactive-glass gallery-item">

            <div class="liquid-glass interactive-glass gallery-item">
